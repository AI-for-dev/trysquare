<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="trysquare">
  <title>trysquare</title>
  <!-- The square upright, in the proportions of the real tool: a long thin blade and
       a short thick stock. Inside the corner sits the right-angle notation, the
       mathematician's mark for "exactly 90 degrees" - which is the claim this tool
       either establishes or refuses to make. -->
  <path d="M8 6 H17 V45 H41 V58 H8 Z" fill="currentColor" />
  <path d="M17 36 H26 V45" fill="none" stroke="currentColor" stroke-width="2.5"
        stroke-linecap="square" opacity="0.5" />
</svg>
