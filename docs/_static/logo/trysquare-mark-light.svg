<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="trysquare">
  <title>trysquare</title>
  <!-- The mark with an explicit ink colour, for a light ground. A separate file is
       needed because currentColor does not cross an <img> boundary: the theme's text
       colour never reaches an SVG referenced as an image, so the monochrome mark would
       fall back to black in both themes. See trysquare-mark-dark.svg. -->
  <path fill-rule="evenodd" fill="#232B33"
        transform="translate(7.6 37.3) rotate(-45)"
        d="M0 0 H12 V12 H48 V21 H0 Z
           M22 17 H23.6 V21 H22 Z
           M28 17 H29.6 V21 H28 Z
           M34 17 H35.6 V21 H34 Z
           M40 17 H41.6 V21 H40 Z" />
</svg>
