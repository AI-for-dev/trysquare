<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="trysquare">
  <title>trysquare</title>
  <!-- The mark: steel blade, brass stock, blade graduated. The brass gives the check a
       handle, the graduations stop it reading as a generic tick. Explicit colours for a
       light ground, because currentColor does not cross an <img> boundary - the theme's
       text colour never reaches an SVG referenced as an image. See -dark.svg. -->
  <g transform="translate(7.6 37.3) rotate(-45)">
    <path fill-rule="evenodd" fill="#232B33"
          d="M11.5 12 H48 V21 H11.5 Z
             M22 17 H23.6 V21 H22 Z
             M28 17 H29.6 V21 H28 Z
             M34 17 H35.6 V21 H34 Z
             M40 17 H41.6 V21 H40 Z" />
    <path fill="#A97C2A" d="M0 0 H12 V21 H0 Z" />
  </g>
</svg>
