<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="trysquare">
  <title>trysquare</title>
  <!-- The mark below 32px, on a light ground. The two tones survive small sizes - a
       block of brass stays a block of brass at 16px - but the graduations do not, so
       they are removed here rather than scaled down into a smear. -->
  <g transform="translate(7.6 37.3) rotate(-45)">
    <path d="M11.5 12 H48 V21 H11.5 Z" fill="#232B33" />
    <path d="M0 0 H12 V21 H0 Z" fill="#A97C2A" />
  </g>
</svg>
