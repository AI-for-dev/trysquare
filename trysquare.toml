# Configuration for this machine. Copy and edit; `--config <path>` points
# elsewhere.
#
# This file replaces environment variables entirely. An environment variable is
# invisible inheritance: a reader of a scenario cannot see it, the archive does not
# record it, and the value that actually ran is whatever the shell happened to
# hold. The previous tool had ten of them, and one of them silently decided the
# thinking level of every measurement ever published.
#
# HARD RULE, enforced at load: this file may only supply **machine paths and load
# fallbacks**. Setting `provider`, `model`, `thinking`, `etalon` or `repetitions`
# in [defaults] raises. Those decide what is measured, so they are mandatory in
# the scenario - otherwise the same file would measure something different on
# another machine.

# Measurable repositories, by logical name. A scenario writes `repo = "my-repo"`,
# and this is the only place that says where that is.
# Relative paths are relative to this file, not to the current directory.
#
# An entry may also be a git URL. It is then cloned once, at the scenario's etalon tag,
# into `workdir/sources/<name>-<hash of the url>-<tag>`, and every run clones from there.
# Keyed by tag, so a clone that is already present is by construction already at the tag
# being asked for: nothing is refetched, and a tag moved upstream cannot change what a
# matrix in flight is measuring. `https://`, `ssh://`, `git://`, `file://` and the
# scp-like `git@host:org/repo.git` are all recognised.
#
# Nothing is declared here, because a repository worth measuring is yours and not the
# tool's. An unknown name is refused at load and lists what is known, so the first
# scenario you run says exactly which line to add.
[repos]
# my-repo = "../my-repo"
# my-repo = "https://github.com/me/my-repo.git"

# Repositories that provide harness bricks, pinned by tag in the scenario. A URL works
# here too, on the same terms. The two bricks the harness needs for itself - the judge's
# verdict tool and the subagent gate - ship inside the package and are never declared.
[harness]
# subagent = "https://github.com/me/my-extension.git"

[defaults]
# Clones live in the system temporary directory, which macOS purges on reboot.
# That is intended: the durable archive keeps only sources, and `replay`
# reconstitutes a tree from a tag and a diff when one is needed again.
workdir = "$TMPDIR/trysquare"

# Fallbacks used only when a scenario is silent. "A plan carries its own load"
# remains the rule: these condition the retry count and therefore every cost
# column, so whatever their origin they are written into `state.json` and printed
# in the synthesis header.
concurrency = 5
timeout = 900
attempts = 3

# Method constants rather than experiment variables: changing them changes how a
# conclusion is drawn, not what is measured. A scenario may override them if it
# says so.
draws = 10000
seed = 20260729
