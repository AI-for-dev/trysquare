# The scenario the previous bench could not express: isolated subagents, and a
# composed validation.
#
# It exercises three things the 2x3 matrix does not: named variants (irregular, not
# a cartesian product), harness bricks by path, and two validators composed.
#
# Renamed from `subagents-judge`: the judge is gone (see below), so the old name
# described a mechanism the scenario no longer uses. The rename also gives the
# matrix its own output directory, which the naming scheme would not otherwise have
# done - the task and the criterion are not part of the directory name.

[scenario]
name = "subagents-citations"
title = "Does a read-only subagent cite more of the code in an impact note?"
hypothesis = "../hypotheses/subagents-citations.md"

[task]
repo = "neon"
etalon = "etalon-v1"
prompt = "../bricks/impact-note-task.md"
# Required because `../validators/neon.py` declares the `tests` metric, and written out
# rather than `npm test` for the reason given in `2x3.toml`.
#
# Worth knowing before reading that column here: this task asks for prose and
# explicitly forbids changing any code, so the suite passes by construction in every
# cell and the number says nothing about the configurations. It is reported, never a
# validity condition - see the note under [verdict], which explains why copying
# `validity = ["delivered", "tests"]` from the 2x3 matrix eliminated the whole matrix.
test_command = "node --test 'game/**/*.test.js'"

[agent]
provider = "ilaas"
model = "gemma-4-31b"
# `high` rather than `off`, and the reason is a constraint rather than a preference.
# A subagent's thinking level cannot be declared anywhere - the frontmatter has no
# field for it and the library passes no option - so it always comes from the
# machine's defaultThinkingLevel. Declaring the ambient level here is what keeps the
# cell from claiming one thing while its subagents do another. The harness refuses to
# run when the two disagree, which is how this was noticed.
thinking = "high"

[protocol]
repetitions = 10
concurrency = 5
timeout = 900
attempts = 3

# --- Harness bricks, by path ----------------------------------------------

# The extension is pinned to a tag and cloned, exactly like the measured
# repository. An experiment that pins the repository and lets the other half of
# the harness float is measuring the operator: this is a living project and its
# main branch moves.
[harness.extension]
repo = "subagent"
tag = "formation-ai4dev-2026-v1"
# The subdirectory loaded with `-e`. Installing it as a package is not an option:
# the package format covers extensions, skills, prompt templates and themes, but
# not agents.
load = "extension"

# Without this gate, dropping definitions into `.pi/agents/` does not activate
# them - and the failure is a silent substitution, not an absence. See the
# comments in the brick itself.
[harness.agent-gate]
load = "../bricks/agent-gate.ts"

# Copied into the clone's `.pi/agents/` and added to `.git/info/exclude`, so scope
# scoring does not count our own configuration as the agent's work.
[harness.agents]
paths = ["../agents/explorer.md", "../agents/tester.md"]
# Optional override. Absent, each file decides its own model, which keeps a cheap
# explorer alongside an expensive coder expressible. Present, it overrides every
# file. Either way the harness refuses to inject an agent that would end up with
# no model at all: nine shipped agents once ran on the wrong provider and returned
# 402 for exactly that reason. Two places may declare, so the trace settles which
# one applied - `configuration.json` records the model used and where it came from.
model = "ilaas/gemma-4-31b"

# The extension hardcodes `.pi/skills/profile/profile.mjs` relative to the measured
# repository, and the etalon does not contain that file. Without this injection the
# gate still blocks, but it hands the model an error message instead of the numbers
# it was supposed to put in front of it.
[harness.skills]
paths = ["../skills/profile"]

# --- Cells: named variants, not a grid -------------------------------------

[variants.nothing]
# the baseline: the model alone, with no toolkit

[variants."+extension"]
# The extension loaded with nobody to delegate to. A witness that matters: it is
# what tells whether the gain comes from the definitions or merely from having a
# delegation tool at all.
harness = ["extension"]

[variants."+subagents"]
harness = ["extension", "agent-gate", "agents"]

[variants."full stack"]
harness = ["extension", "agent-gate", "agents", "skills"]

# --- Composed validation --------------------------------------------------

# Two validators in one scenario, each returning its own named metrics, merged
# into one measurement line per run. They are **independent**: each receives the
# same context and cannot see what the other found. A judge told the script's
# verdict is anchored on it, and its agreement stops being an independent signal.

# 1. What a script can judge, a script judges. Deterministic, free, and not open
#    to argument.
[[validation]]
mode = "script"
command = "../validators/neon.py"
metrics = ["overflow", "issues", "delivered", "in_scope", "tests", "api_stable", "touched"]

# 2. The criterion, counted rather than judged.
#
# This carries the verdict because the judge could not. Scored over two matrices,
# `note_usable` saturated at 10/10 in every cell as soon as the task got easier, and
# all three of the judge's metrics came out identical in **40 runs out of 40** - it
# decided "good note" once and answered everything alike. On the narrower task it had
# discriminated (19 of 40 runs had mixed verdicts), so the halo was induced by the
# task rather than fixed. An instrument that stops discriminating exactly when its
# subject gets easy is not an instrument.
#
# A count has no ceiling and no halo. `bogus_paths` is what makes it worth more than
# a boolean: a note inventing `game/score.js` is worse than one citing nothing, and
# "does it cite paths" scores those two the same. Existence is checked against the
# etalon tag, so citing a file the agent itself created earns nothing.
[[validation]]
mode = "script"
command = "../validators/citations.py"
metrics = ["cited_paths", "exact_paths", "bogus_paths", "cites_paths"]

# --- The judge was here, and was removed ----------------------------------
#
# It scored three metrics against `../rubrics/impact-note.md`. It is gone because it
# could not carry a criterion: over two matrices `note_usable` saturated at 10/10 in
# every cell as soon as the task got easier, and all three of its metrics came out
# identical in **40 runs out of 40** - it decided "good note" once and answered
# everything alike. On the narrower task it had discriminated (19 of 40 runs with
# mixed verdicts), so the halo was induced by the task rather than fixed.
#
# It was kept for one round afterwards to compare the two instruments on identical
# runs, then dropped: it doubled the cost of every matrix for metrics carrying no
# verdict. The rubric is still in the repository, so a `[[validation]]` block with
# `mode = "judge"` brings it back.
#
# No `on_failure` key anywhere: the rule is general. Any validator that crashes,
# times out, returns unreadable JSON or omits a declared metric makes the run
# invalid, never false.

[verdict]
criterion = "cited_paths"
reference = "nothing"
# **No validity condition here, and that is deliberate.**
#
# The obvious thing to write is `validity = ["delivered", "tests"]`, copied from the
# 2x3 matrix. It is wrong, and it was written here once: `delivered` means "a file
# changed", and this task explicitly instructs the agent to write no code and modify
# nothing. So every run was correctly `delivered = false`, the filter eliminated the
# whole matrix, and the reference cell had nothing left to compare against.
#
# The lesson is general: **a validity condition must match the task.** For a task
# that asks for a diff, "changed nothing" means the agent did not work. For a task
# that asks for prose, changing nothing is compliance. There is no condition that is
# right for both.
#
# What remains enforced without declaring anything: a run counts only if it consumed
# tokens, and a run whose validator failed is invalid. Those are global.
