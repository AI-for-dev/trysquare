# A whole scenario, readable end to end, and alive: the test suite loads it and
# dry-runs it against `tests/fixtures/tiny`, so it cannot rot the way a snippet
# in a document does. It is documentation wired to a fixture repository, not an
# experiment - an experiment is about *your* repository and *your* question,
# which is why none ships as one.
#
# Copy it, then: `trysquare init` writes the same shape as a skeleton, and
# `trysquare validate <file>` checks either without spending a token.

[scenario]
name = "example"
title = "Does a project rule change what the agent touches?"
hypothesis = "hypothesis.md"

[task]
# `tiny` is resolved by the nearest trysquare.toml (here: tests/fixtures/machine.toml,
# which the suite passes with --config). Your config points your names at your paths.
repo = "tiny"
etalon = "etalon-v1"
prompt = """
The basket total is wrong when the list is empty. Fix it.
"""
# The suite that decides the `tests` metric - declared, never detected, so an
# agent editing a script named `test.sh` cannot decide its own score.
test_command = "python3 -m unittest discover -s tests -t ."
# What running that suite leaves behind, which is not the agent's work. Declared for
# the same reason the suite is: only this task's author knows which paths here are
# by-products. Without it, an agent that ran the tests to check its own fix scored out
# of scope for the bytecode - so the runs that verified themselves scored worst.
artefacts = ["__pycache__"]

[agent]
provider = "test-provider"    # mandatory, never inherited from any config
model = "test-model"
thinking = "off"

[protocol]
repetitions = 10              # declared in advance; a matrix is never rerun "to see"
concurrency = 5
timeout = 900

# One axis, two cells. The first value is the baseline and declares no delta.
[axes]
context = ["nothing", "rule"]

[values.context.rule]
context = """
Do not rename or remove an exported name: the tests depend on it.
"""

[[validation]]
mode = "script"
command = "validator.py"      # examples/validator.py, whole and executable
metrics = ["delivered", "in_scope", "tests", "touched", "documented"]

[verdict]
criterion = "in_scope"
reference = { context = "nothing" }
validity = ["delivered", "tests"]
