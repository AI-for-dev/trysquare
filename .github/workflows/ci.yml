# The suite needs no network and no API key, which is why it can be the gate.
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # The floor is what pyproject requires, the ceiling is what the author
      # runs. Nothing in between is left untested.
      matrix:
        python: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      # pytest rather than `unittest discover`, and for this job's own sake. With
      # nothing to collect, `unittest discover` exits 5 on 3.12+ but **0** on 3.11 -
      # so a test file gutted by a refactor reads as a green gate on the first
      # version of this matrix. pytest exits 5 everywhere. The hole is documented
      # from the other side in `tests/test_example.py`, where it is a thing the
      # harness refuses to score; a gate that cannot see it is the same
      # silence-read-as-success this tool exists to catch.
      - run: uv run --python ${{ matrix.python }} --group dev pytest

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      # Pinned: an unpinned linter turns someone else's release into a red
      # build on a branch that changed nothing.
      # From the dev group, so a local run is the same run. Was `uvx ruff@0.15.20`,
      # which nothing outside this file pinned or could reproduce.
      - run: uv run --group dev ruff check trysquare tests examples tools docs
      - run: uv run --group dev ruff format --check trysquare tests examples tools docs

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      # `make html` already passes -W: a warning is a defect in the
      # documentation, held to the same standard as the code.
      - run: uv run --extra docs make -C docs html

  # The boundaries between runs, exercised for real. `test` skips these tests where
  # docker or bwrap cannot run, which on a stock runner is always for bwrap: a green
  # gate that checked no boundary. This job gives them what they need and fails if
  # one of them still skips.
  isolation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends bubblewrap
      # Ubuntu forbids unprivileged user namespaces through AppArmor since 24.04, and
      # bwrap needs one. Where the knob does not exist, nothing forbids them.
      - run: |
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
      # The image the docker tests run in. Pulled here, never by the tests.
      - run: docker pull alpine:3
      - shell: bash
        run: |
          uv run --group dev pytest tests/test_confine.py -k Inside -rs | tee pytest.log
          ! grep -qi skipped pytest.log
