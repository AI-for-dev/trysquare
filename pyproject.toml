[project]
name = "trysquare"
version = "0.1.0"
description = "A scenario harness for measuring coding agents reproducibly."
requires-python = ">=3.11"
# `rich` draws the pinned progress bar a matrix needs when it runs for hours.
# TOML parsing is `tomllib`, which is why the floor is 3.11.
dependencies = ["rich>=13.7"]

[project.optional-dependencies]
# Documentation build only, never imported by the package.
docs = [
    "sphinx>=8.1",
    "myst-parser[linkify]>=4.0",
    "sphinx-design>=0.6",
    "furo>=2024.8.6",
    "sphinx-copybutton>=0.5.2",
]

[project.scripts]
# The installed command. It is a shell entry point rather than `cli:main` directly,
# because a name typed in a shell has to answer for an interrupt and a closed pipe;
# the subcommands themselves are `trysquare.cli`, shared with `python -m trysquare`.
trysquare = "trysquare.scripts.cli_trysquare:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["trysquare"]
