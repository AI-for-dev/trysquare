[project]
name = "trysquare"
version = "0.1.0"
description = "A scenario harness for measuring coding agents reproducibly."
requires-python = ">=3.11"
# No runtime dependencies, on purpose. TOML parsing is `tomllib` from the
# standard library, which is why the floor is 3.11. A measurement tool that
# needs an install step is a measurement tool people work around.
dependencies = []

[project.optional-dependencies]
# Documentation build only, never imported by the package. The tool itself keeps
# zero runtime dependencies on purpose.
docs = [
    "sphinx>=8.1",
    "myst-parser[linkify]>=4.0",
    "sphinx-design>=0.6",
    "furo>=2024.8.6",
    "sphinx-copybutton>=0.5.2",
]

[project.scripts]
trysquare = "trysquare.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["trysquare"]
